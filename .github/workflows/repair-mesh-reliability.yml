name: Repair mesh reliability

on:
  push:
    branches:
      - feature/hop-encryption-relay

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[mesh-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hop-encryption-relay
          fetch-depth: 1

      - name: Apply reliability fixes
        run: python3 tools/repair_mesh.py

      - name: Commit reliability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/offgrid/app/data/transport/MockCommunicationTransport.kt
          git diff --cached --quiet || git commit -m "fix: stabilize mesh routing [mesh-repair]"
          git push origin feature/hop-encryption-relay

      - name: Remove repair script and workflow
        run: |
          git rm tools/repair_mesh.py .github/workflows/repair-mesh-reliability.yml
          git commit -m "chore: remove one-shot mesh repair [mesh-repair]"
          git push origin feature/hop-encryption-relay
